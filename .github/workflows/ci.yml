name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck test
      - run: pnpm lint
      - run: pnpm format:check

  self-scan:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=vulnstack...
      - name: Stage manifests (excludes intentionally vulnerable fixtures/)
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          cp pnpm-lock.yaml pnpm-workspace.yaml package.json "$RUNNER_TEMP/scan/"
          for f in apps/*/package.json packages/*/package.json; do
            mkdir -p "$RUNNER_TEMP/scan/$(dirname "$f")"
            cp "$f" "$RUNNER_TEMP/scan/$f"
          done
      - name: Scan
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node apps/cli/dist/index.js scan "$RUNNER_TEMP/scan" --format sarif --output vulnstack.sarif --fail-on critical
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('vulnstack.sarif') != '' && github.event.pull_request.head.repo.fork != true
        with:
          sarif_file: vulnstack.sarif
          category: vulnstack
      - name: Enforce result
        if: steps.scan.outputs.code != '0'
        run: exit "${{ steps.scan.outputs.code }}"

  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
